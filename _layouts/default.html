<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <title>{{ page.title }}{% unless page.title == site.title %} · {{ site.title }}{% endunless %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
    <link rel="icon" type="image/svg+xml" href="{{ site.home }}/assets/favicon.svg">
    <style>{{ '@use "main";' | scssify }}</style>
    {% seo title=false %}
    {% feed_meta %}
    {% include person.html %}
  </head>
  <body>
    <header>
      <a href="{{ site.home }}/">{{ site.handle }}</a>
      <figure>{% include avatar.svg %}</figure>
    </header>
    <main>
      <article>
        <h1>{{ page.title }}</h1>
        <div class="content">{{ content }}</div>
      </article>
    </main>
  </body>
</html>
