title: Kamil Jiwa
handle: "~kjiwa"
description: >-
  Kamil Jiwa's notes on programming, systems, and security research.
author:
  name: Kamil Jiwa
  url: https://crimsonglow.ca/~kjiwa/
email: kjiwa@crimsonglow.ca
lang: en
timezone: America/Vancouver
baseurl: ""
home: "/~kjiwa"
url: "https://crimsonglow.ca"
permalink: /~kjiwa/:year/:month/:title:output_ext

sass:
  style: compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
    values:
      image:
        path: /~kjiwa/assets/og-card.png
        width: 1200
        height: 630
        alt: Kamil Jiwa

feed:
  path: ~kjiwa/feed.xml

include:
  - ".htaccess"
  - "~kjiwa"

exclude:
  - README.md
  - tools

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
