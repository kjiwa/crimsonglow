title: ~kjiwa
description: Notes on programming, systems, and security research.
author: Kamil Jiwa
email: kjiwa@crimsonglow.ca
lang: en
timezone: America/Vancouver
baseurl: ""
home: "/~kjiwa"
url: "https://crimsonglow.ca"
permalink: /~kjiwa/:year/:month/:title:output_ext

sass:
  style: compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

feed:
  path: ~kjiwa/feed.xml

include:
  - ".htaccess"
  - "~kjiwa"

exclude:
  - README.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
