version: 2
updates:
  - package-ecosystem: bundler
    directory: "/site"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Provider-bump PRs lose the darwin lock hashes; README.md, Infrastructure, has the fix.
  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ["*"]
