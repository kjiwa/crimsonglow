name: Link check

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch:

# Least privilege: issues: write files the tracking issue, contents: read lets
# checkout clone.
permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: site

      - name: Build site
        run: make build

      - name: Check external links
        id: check
        continue-on-error: true
        # Naming bash adds pipefail; without it tee's status hides the failure.
        # htmlproofer writes failures to stderr.
        shell: bash
        run: make link-check 2>&1 | tee link-check-output.txt

      - name: File or update tracking issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/link-rot-issue.sh open link-check-output.txt "$RUN_URL"

      - name: Close stale tracking issue
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/link-rot-issue.sh close
