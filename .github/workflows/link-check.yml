name: Link check

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch:

# permissions: is an exhaustive declaration -- any scope not named here is set
# to none, overriding the repository default. contents: read is required for
# actions/checkout to clone this private repo; without it the clone fails with
# a misleading "Repository not found".
permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: site

      - name: Check external links
        id: check
        continue-on-error: true
        # shell: bash is explicit here (not just the runner default) because
        # GitHub only adds -o pipefail when bash is named directly; the
        # default run shell is `bash -e` without it. Without pipefail this
        # step's exit status would be tee's, so continue-on-error /
        # steps.check.outcome below would always see "success".
        shell: bash
        run: make link-check | tee link-check-output.txt

      - name: File or update tracking issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/link-rot-issue.sh open link-check-output.txt "$RUN_URL"

      - name: Close stale tracking issue
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/link-rot-issue.sh close
