name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A main-branch deploy must never be cut off mid-sync.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # Reads site/.ruby-version. If ruby-build has no prebuilt binary yet
          # for this exact patch release, setup-ruby falls back to compiling
          # from source, which is slower but still correct -- no action needed
          # unless the build step itself fails.
          bundler-cache: true
          working-directory: site

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Lint and check
        run: make lint check

      - name: Build webmail
        run: make webmail

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/_site
          if-no-files-found: error

      - name: Upload webmail
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: webmail
          path: webmail/dist/alps.zip
          if-no-files-found: error

  deploy:
    needs: [build, privacy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/_site

      - uses: actions/download-artifact@v8
        with:
          name: webmail
          path: webmail/dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Deploy
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
        run: scripts/deploy.sh

      - name: Deploy webmail
        env:
          WEBMAIL_FUNCTION: ${{ vars.WEBMAIL_FUNCTION }}
        run: scripts/webmail-deploy.sh

  privacy:
    uses: kjiwa/.github/.github/workflows/privacy.yml@main
