name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # Reads site/.ruby-version. If ruby-build has no prebuilt binary yet
          # for this exact patch release, setup-ruby falls back to compiling
          # from source, which is slower but still correct -- no action needed
          # unless the build step itself fails.
          bundler-cache: true
          working-directory: site

      - name: Lint and check
        run: make lint check

  privacy:
    uses: kjiwa/.github/.github/workflows/privacy.yml@main
