<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000077">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000066">
    <title>{{ page.title }}{% unless page.title == site.title %} · {{ site.title }}{% endunless %}</title>
    {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
    <link rel="icon" type="image/svg+xml" href="{{ site.home }}/assets/favicon.svg">
    <link rel="preload" href="{{ site.home }}/assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ site.home }}/assets/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <style>{{ '@use "main";' | scssify }}</style>
    {% seo title=false %}
    {% feed_meta %}
    {% include person.html %}
    <script src="{{ site.home }}/assets/site.js" defer></script>
  </head>
  <body class="{{ page.layout }}">
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
      {% include path.html %}
      <span class="header-avatar" aria-hidden="true">{% include avatar.svg %}</span>
    </header>
    <div class="page">
      <aside class="rail" aria-label="Navigation">
        {% include dir.html %}
        {% include contact.html %}
      </aside>
      <main id="main">
        <article>
          <h1>{{ page.title }}</h1>
          <div class="content">{{ content }}</div>
        </article>
      </main>
      <aside class="toc-rail" aria-label="On this page"></aside>
    </div>
    <footer class="site-footer">
      {% include contact.html %}
    </footer>
  </body>
</html>
