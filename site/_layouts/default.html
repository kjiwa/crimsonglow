<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000077">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000066">
    <title>{{ page.title }}{% unless page.title == site.title %} · {{ site.title }}{% endunless %}</title>
    {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
    <link rel="icon" type="image/svg+xml" href="{{ site.home }}/assets/favicon.svg">
    <style>{{ '@use "main";' | scssify }}</style>
    {% seo title=false %}
    {% feed_meta %}
    {% include person.html %}
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
      <a href="{{ site.home }}/" class="header-brand">
        <span class="header-handle">{{ site.handle }}</span>
        <span class="header-avatar" aria-hidden="true">{% include avatar.svg %}</span>
      </a>
    </header>
    <main id="main">
      <article>
        <h1>{{ page.title }}</h1>
        <div class="content">{{ content }}</div>
      </article>
    </main>
  </body>
</html>
