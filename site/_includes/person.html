{%- comment -%}
sameAs binds the ~kjiwa handle to external profiles. jobTitle and knowsAbout provide
topical disambiguation for name queries.
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": {{ "/~kjiwa/#person" | absolute_url | jsonify }},
  "name": {{ site.title | jsonify }},
  "jobTitle": {{ site.job_title | jsonify }},
  "url": {{ "/~kjiwa/" | absolute_url | jsonify }},
  "image": {{ "/~kjiwa/assets/og-card.png" | absolute_url | jsonify }},
  "description": {{ site.description | strip | jsonify }},
  "knowsAbout": {{ site.knows_about | jsonify }},
  "sameAs": {{ site.data.profiles | map: "url" | jsonify }}
}
</script>
